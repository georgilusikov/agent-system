forty_principles:
  name_ru: "40 Изобретательских принципов"
  phase: [synthesis]
  redkolis_code: "ПРИНЦИПЫ"
  category: core_triz
  trigger:
    - "Есть сформулированное ТП (техническое противоречие)"
    - "Нужен быстрый набор идей для решения"
    - "Таблица Альтшуллера рекомендует конкретные принципы"
  goal: "Применить рекомендуемые принципы к ТП → сгенерировать решения"
  when_not_to_use:
    - "КРИТИЧНО: Применение без жёстко сформулированного ТП"
    - "Перебор принципов вслепую, минуя матрицу Альтшуллера"
  sequence_after: [contradictions]  # ТП → 40 Принципов (строго!)
  leads_to: [effects, fos]
  differs_from:
    standards: "Принципы → для ТП, Стандарты → для вепольных моделей"
    effects: "Принципы — абстрактные приёмы, Эффекты — конкретные физ./хим./геом. явления"
    arip: "40 Принципов — один инструмент, АРИП — облегчённый алгоритм"
  input: "ТП + пара конфликтующих параметров"
  output: "Список подходящих принципов + идеи решений"
  dependencies: [contradictions]
  constraints: []

standards:
  name_ru: "76 Стандартов (18 ключевых)"
  phase: [synthesis]
  redkolis_code: "СТАНДАРТЫ"
  category: core_triz
  trigger:
    - "Есть вепольная модель"
    - "Нужно преобразовать вредный/неполный/недостаточный веполь"
    - "АРИЗ рекомендует применить стандарты"
  goal: "Подобрать подходящий стандарт → преобразовать веполь"
  when_not_to_use:
    - "КРИТИЧНО: Применение без предварительно построенной вепольной модели"
    - "Разрешение параметрических конфликтов (ТП) — стандарты для структурных"
  sequence_after: [vepoli]  # Веполь → Стандарты (строго!)
  leads_to: [effects]
  differs_from:
    forty_principles: "Стандарты → для веполей, Принципы → для ТП"
    vepoli: "Веполи — модель, Стандарты — способы преобразования"
  input: "Вепольная модель + тип задачи"
  output: "Рекомендуемые стандарты + направления решения"
  dependencies: [vepoli]
  constraints: []

effects:
  name_ru: "База физических/химических/геометрических эффектов"
  phase: [synthesis]
  redkolis_code: "БЭФ"
  category: core_triz
  trigger:
    - "Нужен конкретный физический/химический эффект для реализации"
    - "Известна требуемая функция, нужен МЕХАНИЗМ"
    - "АРИЗ рекомендует применить эффекты"
  goal: "Подобрать эффект для реализации требуемой функции"
  when_not_to_use:
    - "Задача ещё не абстрагирована до функции"
    - "Нет понимания требуемого поведения (ММЧ/ИКР не сформулированы)"
  sequence_after: [ikr, mmch, ariz]
  leads_to: [experiment_designer, final_triz_report]
  differs_from:
    forty_principles: "Эффекты — конкретные физические явления, Принципы — абстрактные приёмы"
    standards: "Эффекты — физика, Стандарты — вепольные преобразования"
  input: "Требуемая функция/действие"
  output: "Подходящие эффекты + способы применения"
  dependencies: [ariz, resource_analysis]
  constraints: []

fos:
  name_ru: "Функционально-ориентированный поиск (ФОП)"
  phase: [synthesis]
  redkolis_code: "ФОП"
  category: core_triz
  trigger:
    - "Нужно найти решения в ДРУГИХ областях техники"
    - "Функциональный перенос: 'кто ещё решает эту функцию?'"
    - "Поиск прототипов для решения"
  goal: "Найти аналоги функции в других областях → перенести решение"
  when_not_to_use:
    - "КРИТИЧНО: Применение без предварительного абстрагирования функции от специфики отрасли"
    - "Если на рынке есть прямые конкуренты с нужным свойством (нужен Бенчмаркинг)"
  sequence_after: [contradictions, resource_analysis]  # Функция → ФОП (строго!)
  leads_to: [ofop, reverse_fos]
  differs_from:
    benchmarking: "ФОП ищет функциональные АНАЛОГИ, БМ — сравнивает системы"
    reverse_fos: "ФОП: функция → области, Обратный ФОП: решение → рынки"
    ofop: "ФОП — прямой поиск, ОФОП — обратный (от решения к применениям)"
  input: "Функция для поиска + параметры"
  output: "Области-аналоги + прототипы решений"
  dependencies: [contradictions, benchmarking, forty_principles, resource_analysis, trimming, limits_strategy]
  constraints: []

reverse_fos:
  name_ru: "Обратный ФОП (Market Finder)"
  phase: [synthesis]
  redkolis_code: ""
  category: extended
  trigger:
    - "Есть решение — нужно найти другие области применения"
    - "Коммерциализация изобретения"
  goal: "Найти новые рынки/области для существующего решения"
  differs_from:
    fos: "ФОП: проблема → решения, Обратный ФОП: решение → рынки"
  input: "Готовое решение/принцип"
  output: "Новые области применения + потенциальные рынки"
  dependencies: [fos]
  constraints: []

ofop:
  name_ru: "Обратный ФОП (Market Discovery)"
  phase: [synthesis]
  redkolis_code: "ОФОП"
  category: core_triz  # Codex fix: ОФОП входит в канон Редколис (Синтез)
  trigger:
    - "Есть изобретение — где ещё применить?"
    - "Потенциальные применения решения"
  goal: "Найти новые области применения для решения"
  when_not_to_use:
    - "Применение для улучшения функционала текущего продукта"
    - "Применение до абстрагирования функции исходной технологии"
  sequence_after: [fos]
  leads_to: [final_triz_report]
  differs_from:
    reverse_fos: "ОФОП — более структурированный вариант обратного ФОП"
    fos: "ОФОП ищет ОТ решения, ФОП — К решению"
  input: "Решение/изобретение"
  output: "Области применения + оценка потенциала"
  dependencies: [reverse_fos]
  constraints: []

rtv:
  name_ru: "Развитие творческого воображения"
  phase: [modeling, synthesis]  # NLM fix: РТВ в обеих фазах по Редколис
  redkolis_code: "РТВ"
  category: core_triz
  trigger:
    - "Нужно развить творческое мышление"
    - "Обучение/тренировка"
    - "Генерация фантастических идей"
  goal: "Упражнения и методы для снятия психологической инерции"
  when_not_to_use:
    - "Замена строгих алгоритмов (АРИЗ) генерацией фантазий при решении критических аварий"
    - "Применение для точного инженерного расчёта"
  sequence_after: [rvs, mmch]
  leads_to: [goldfish, robinson]
  differs_from:
    rvs: "РВС — конкретный инструмент (мысленные эксперименты), РТВ — система упражнений"
    goldfish: "Золотая рыбка — один метод в рамках РТВ"
  input: "Задача или тема для упражнения"
  output: "Фантастические идеи + снятие инерции"
  dependencies: [rvs, mmch, goldfish, robinson]
  constraints: []

arip:
  name_ru: "АРИП (АРИЗ упрощённый)"
  phase: [modeling, synthesis]  # NLM fix: АРИП в обеих фазах по Редколис
  redkolis_code: "АРИП"
  category: core_triz
  trigger:
    - "Средняя по сложности задача"
