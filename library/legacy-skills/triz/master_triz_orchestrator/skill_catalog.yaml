# ============================================================================
# SKILL CATALOG — Каталог ТРИЗ-инструментов для оркестратора
# ============================================================================
# Канон: Лекция Е. Редколис (МАТРИЗ ур.4), 34 инструмента по 3 фазам
# Версия: 1.0.0
# Дата: 2026-03-14
# ============================================================================
#
# Структура каждого скилла:
#   name_ru:       Русское название
#   phase:         Фаза по Редколис [analysis, modeling, synthesis]
#                  Некоторые инструменты принадлежат нескольким фазам
#   redkolis_code: Код инструмента по Редколис (если есть)
#   category:      Категория: core_triz | extended | utility | phantom
#   trigger:       Когда вызывать (условия)
#   goal:          Что даёт на выходе
#   differs_from:  Чем отличается от похожих
#   input:         Что ожидает на входе
#   output:        Что выдаёт
#   dependencies:  Требуемые предшественники
#   constraints:   Ограничения по канону Редколис
# ============================================================================

# ═══════════════════════════════════════════════════════════════════════════════
# ФАЗА 1: АНАЛИЗ (18 инструментов по Редколис)
# ═══════════════════════════════════════════════════════════════════════════════

akts:
  name_ru: "Анализ ключевых требований к системе"
  phase: [analysis]
  redkolis_code: "АКТС"
  category: core_triz
  trigger:
    - "Начало любого ТРИЗ-проекта"
    - "Завершение проекта (финальная сверка)"
    - "Неясны требования к системе"
    - "Нужно определить MPV (минимально полезный вариант)"
  when_not_to_use:
    - "Середина проекта без ясной необходимости пересмотра ТЗ"
    - "Если требования уже зафиксированы и утверждены стейкхолдерами"
  sequence_after: []  # Всегда ПЕРВЫЙ в проекте
  leads_to: [benchmarking, functional_analysis, causal_analysis]
  goal: "Определить ключевые требования, ограничения и MPV системы"
  differs_from:
    functional_analysis: "АКТС определяет ЧТО система должна делать, ФА — КАК компоненты взаимодействуют"
    value_analysis: "АКТС фокусируется на требованиях, ФСА — на стоимости функций"
  input: "Описание системы + бизнес-контекст"
  output: "Список ключевых требований + MPV + ограничения"
  dependencies: []
  constraints:
    - "АКТС используется в НАЧАЛЕ и в КОНЦЕ проекта (двойной АКТС)"
    - "Если АКТС не дал ясности — перейти на уровень надсистемы"

functional_analysis:
  name_ru: "Функциональный анализ"
  phase: [analysis]
  redkolis_code: "ФА"
  category: core_triz
  trigger:
    - "Нужно понять как компоненты системы взаимодействуют"
    - "Есть вредные взаимодействия"
    - "Нужна функциональная модель для дальнейшего анализа"
  goal: "Построить функциональную модель: компоненты + связи (полезные, вредные, недостаточные)"
  when_not_to_use:
    - "Применение к технологиям/процессам, развёрнутым во времени (для этого нужен ФАП)"
    - "Применение до составления компонентной модели (КА)"
  sequence_after: [akts, structural_analysis]
  leads_to: [value_analysis, trimming, vepoli, contradictions]
    structural_analysis: "ФА строит модель ФУНКЦИЙ, СтрА — модель СТРУКТУРЫ"
    flow_analysis: "ФА анализирует взаимодействия, ФлА — потоки (энергия, вещество, информация)"
    value_analysis: "ФА — модель функций, ФСА — экономическая оценка функций"
  input: "Описание системы + компоненты + среда"
  output: "Функциональная модель (таблица/граф) + классификация связей"
  dependencies: []
  constraints:
    - "Основа для многих других инструментов (тримминг, вепольный анализ, ФСА)"

causal_analysis:
  name_ru: "Причинно-следственный анализ (ПСА)"
  phase: [analysis]
  redkolis_code: "ПСА"
  category: core_triz
  trigger:
    - "Есть нежелательный эффект с неясной причиной"
    - "Повторяющийся сбой/брак"
    - "Нужно найти корневую причину"
  goal: "Построить дерево причин → выявить корневые причины"
  when_not_to_use:
    - "Применение в СЕРЕДИНЕ цепочки аналитических инструментов (ПСА строго ПЕРВЫМ или ПОСЛЕДНИМ!)"
    - "Продолжение построения ветви, если причина вышла в надсистему (неконтролируемая)"
  sequence_after: []  # Или строго ПЕРВЫЙ, или строго ПОСЛЕДНИЙ в аналитической цепочке
  leads_to: [contradictions, oz_ov, diversion_analysis]
    diversion_analysis: "ПСА ищет причины СУЩЕСТВУЮЩИХ проблем, ДА предсказывает ПОТЕНЦИАЛЬНЫЕ"
    flow_analysis: "ПСА строит цепочку причин, ФлА анализирует потоки"
    avf: "ПСА фокусируется на причинах внутри системы, АВФ — на влиянии внешней среды"
  input: "Описание нежелательного эффекта"
  output: "Дерево причинно-следственных связей + корневые причины"
  dependencies: []
  constraints:
    - "ПСА — ПЕРВЫМ если причина неизвестна, ПОСЛЕДНИМ если нужна верификация"
    - "Если ПСА не даёт нового знания — сменить системный уровень"

system_operator:
  name_ru: "Системный оператор (9 экранов)"
  phase: [analysis, modeling]  # NLM fix: СО в обеих фазах по Редколис
  redkolis_code: "СО"
  category: core_triz
  trigger:
    - "Нужен широкий взгляд на систему"
    - "Анализ эволюции системы (прошлое → настоящее → будущее)"
    - "Важно увидеть надсистему и подсистемы"
  goal: "Построить 9-экранную модель: 3 уровня × 3 времени"
  when_not_to_use:
    - "Разрешение физического микроконфликта внутри одной детали"
    - "Игнорирование эволюционной оси времени (прошлое/будущее)"
  sequence_after: [akts]
  leads_to: [s_curve, zrts, rvs]
    s_curve: "СО даёт ПРОСТРАНСТВЕННО-ВРЕМЕННОЙ обзор, S-кривая — ЭВОЛЮЦИОННУЮ стадию"
    zrts: "СО описывает систему как есть, ЗРТС предсказывает КАК она будет развиваться"
  input: "Система для анализа"
  output: "9-экранная матрица + инсайты из каждого экрана"
  dependencies: []
  constraints: []

avf:
  name_ru: "Анализ внешней функции (Анализ внешних факторов)"
  phase: [analysis]
  redkolis_code: "АВФ"
  category: core_triz
  trigger:
    - "Система работает в агрессивной среде"
    - "Внешние факторы влияют на работу системы"
    - "Нужно оценить взаимодействие с надсистемой"
  goal: "Выявить внешние вредные/полезные воздействия на систему"
  when_not_to_use:
    - "Нет данных о реальных внешних условиях эксплуатации"
    - "Изолированная система без внешних взаимодействий"
  sequence_after: [functional_analysis]
  leads_to: [diversion_analysis, resource_analysis]
    functional_analysis: "ФА анализирует ВНУТРЕННИЕ взаимодействия, АВФ — ВНЕШНИЕ"
    diversion_analysis: "АВФ описывает реальные внешние факторы, ДА изобретает гипотетические"
  input: "Система + её окружение"
  output: "Перечень внешних факторов + оценка влияния"
  dependencies: [flow_analysis, diversion_analysis]
  constraints: []

structural_analysis:
  name_ru: "Структурный анализ"
  phase: [analysis]
  redkolis_code: "СА"
  category: core_triz
  trigger:
    - "Нужно понять устройство системы"
    - "Анализ иерархии компонентов"
    - "Подготовка к динамизации или вепольному анализу"
  goal: "Построить структурную модель: иерархия компонентов + связи"
  when_not_to_use:
    - "Применение для анализа динамики и хронологии бизнес-процессов (для этого нужен ФАП)"
    - "Попытка заменить функциональный анализ структурным"
  sequence_after: [akts]
  leads_to: [functional_analysis, flow_analysis]
    functional_analysis: "СтрА — ЧТО из чего состоит, ФА — КАК взаимодействует"
  input: "Система для анализа"
  output: "Структурная схема + иерархия компонентов"
  dependencies: [dynamization, vepoli]
  constraints: []

flow_analysis:
  name_ru: "Потоковый анализ"
  phase: [analysis]
  redkolis_code: "ПА"
  category: core_triz
  trigger:
    - "Система включает потоки (энергия, вещество, информация)"
    - "Есть узкие места или потери в потоках"
    - "Нужно оптимизировать логистику/производство"
  goal: "Построить модель потоков + выявить узкие места и потери"
  when_not_to_use:
    - "Статичные конструкции без перемещения вещества/энергии/информации"
    - "Применение без предварительного выявления компонентов системы"
  sequence_after: [structural_analysis, functional_analysis]
  leads_to: [trimming, contradictions, resource_analysis]
    functional_analysis: "ФлА анализирует ПОТОКИ, ФА — ФУНКЦИИ"
    value_analysis: "ФлА ищет узкие места, ФСА — дорогие/бесполезные функции"
  input: "Система с потоками"
  output: "Карта потоков + узкие места + потери"
  dependencies: [trimming, contradictions]
  constraints: []

value_analysis:
  name_ru: "Функционально-стоимостный анализ (ФСА)"
  phase: [analysis, modeling]  # NLM fix: ФСА в обеих фазах по Редколис
  redkolis_code: "ФСА"
  category: core_triz
  trigger:
    - "Система слишком дорогая"
    - "Нужно сократить издержки без потери функций"
    - "Избыточные компоненты/функции"
  goal: "Оценить стоимость каждой функции → выявить дорогие/бесполезные"
  when_not_to_use:
    - "Применение до выявления функций компонентов (ФА)"
    - "Проекты, где снижение затрат НЕ является целью (напр. обход патента или прогноз)"
  sequence_after: [functional_analysis]
  leads_to: [trimming, contradictions]
    functional_analysis: "ФА строит модель, ФСА добавляет СТОИМОСТНУЮ оценку"
    trimming: "ФСА оценивает, Тримминг — удаляет"
  input: "Функциональная модель + стоимости"
  output: "Таблица функция-стоимость + кандидаты на оптимизацию"
  dependencies: [functional_analysis, trimming]
  constraints: []

diversion_analysis:
  name_ru: "Диверсионный анализ (AFD)"
  phase: [analysis, modeling]  # NLM fix: ДиА в обеих фазах по Редколис
  redkolis_code: "ДиА"
  category: core_triz
  trigger:
    - "Нужно предсказать потенциальные сбои"
    - "Аудит безопасности/надежности"
    - "Вопрос 'что может пойти не так?'"
  goal: "Изобрести способы ВЫЗВАТЬ проблему → найти уязвимости"
  when_not_to_use:
    - "Применение на этапе синтеза или верификации решений"
    - "Задачи типа 'сделайте принципиально новый продукт'"
  sequence_after: [functional_analysis, causal_analysis]
  leads_to: [resource_analysis, antisystem, robinson]
    causal_analysis: "ДА изобретает ПОТЕНЦИАЛЬНЫЕ проблемы, ПСА анализирует СУЩЕСТВУЮЩИЕ"
    afd_failure_predictor: "ДА — общий метод, AFD — специализация по классификации Певзнера"
  input: "Система + требование 'сломать её'"
  output: "Список уязвимостей + сценарии отказов"
  dependencies: []
  constraints: []

s_curve:
  name_ru: "Анализ S-кривой"
  phase: [analysis]
  redkolis_code: "ЗРТС (часть)"
  category: core_triz
  trigger:
    - "Нужно определить стадию развития системы"
    - "Вопрос 'стоит ли развивать или заменять?'"
    - "Прогноз эволюции"
  goal: "Определить стадию на S-кривой → рекомендации по стратегии"
  when_not_to_use:
    - "Аудит текущих рисков или поиск причин локального брака"
    - "Применение без сбора исторического контекста (Системный оператор)"
  sequence_after: [system_operator]
  leads_to: [zrts, limits_strategy]
    zrts: "S-кривая — один из инструментов ЗРТС, даёт стадию развития"
    limits_strategy: "S-кривая показывает ГДЕ система, Пределы — КУДА может дойти"
  input: "Историческая динамика параметров системы"
  output: "Стадия на S-кривой + стратегическая рекомендация"
  dependencies: []
  constraints: []

benchmarking:
  name_ru: "Функциональный бенчмаркинг"
  phase: [analysis]
  redkolis_code: "БМ"
  category: core_triz
  trigger:
    - "Нужно сравнить с аналогами/конкурентами"
    - "Поиск лучших практик в других областях"
    - "Функциональное сравнение систем"
  goal: "Найти лучшие реализации функций в других системах"
  when_not_to_use:
    - "Ещё не определены ключевые функции для сравнения (нужен АКТС)"
    - "Задача не требует заимствования — нужен оригинальный подход"
  sequence_after: [akts]
  leads_to: [oas_transfer, fos]
    fos: "БМ сравнивает системы, ФОП ищет решения через функциональный перенос"
    principle_comparison: "БМ — широкое сравнение, ПС — конкретное сравнение принципов действия"
  input: "Система + ключевые функции для сравнения"
  output: "Таблица сравнения + лучшие практики"
  dependencies: [fos]
  constraints: []

limits_strategy:
  name_ru: "Анализ пределов развития"
  phase: [analysis]
  redkolis_code: "ПРЕДЕЛЫ"
  category: core_triz
  trigger:
    - "Система приближается к физическим/технологическим пределам"
    - "Нужно понять максимальный потенциал системы"
    - "Оценка 'потолка' для параметров"
  goal: "Определить предельные значения параметров и стратегию обхода"
  when_not_to_use:
    - "Система на ранней стадии S-кривой (пределы ещё далеко)"
    - "Применение без предварительного определения положения на S-кривой"
  sequence_after: [s_curve, system_operator]
  leads_to: [zrts, contradictions]
    s_curve: "S-кривая показывает стадию, Пределы — максимально достижимые значения"
    zrts: "Пределы — количественная оценка, ЗРТС — качественные тренды"
  input: "Ключевые параметры системы + тренды"
  output: "Предельные значения + стратегия обхода пределов"
  dependencies: [s_curve, zrts]
  constraints: []

# ФАП — не выделен в отдельный скилл, входит в functional_analysis
# КА — не выделен отдельно, входит в causal_analysis (компонентный анализ)
# ИА (Инвентивный анализ) — в Анализе, также в Моделировании → см. inversion

# ═══════════════════════════════════════════════════════════════════════════════
# ФАЗА 2: МОДЕЛИРОВАНИЕ (15 инструментов по Редколис)
# ═══════════════════════════════════════════════════════════════════════════════

contradictions:
  name_ru: "Формулировка противоречий (ТП/ФП)"
  phase: [analysis, modeling]  # NLM fix: ТП в обеих фазах по Редколис
  redkolis_code: "ТП"  # Codex note: ФП также канонический код (в Моделировании)
  redkolis_codes: ["ТП", "ФП"]  # ТП → Анализ+Моделирование, ФП → Моделирование
  category: core_triz
  trigger:
    - "Улучшение одного параметра ухудшает другой"
    - "Найдена пара конфликтующих требований"
    - "Нужно сформулировать задачу как противоречие"
  goal: "Сформулировать ТП (техническое) и ФП (физическое) противоречия"
  when_not_to_use:
    - "ТП: формулирование без выбора конкретной пары улучшаемого/ухудшающегося параметров"
    - "ФП: использование для описания макро-конфликтов (нужен ТП); ФП — вз.исключ. требования к ОДНОМУ элементу"
  sequence_after: [functional_analysis, causal_analysis]
  leads_to: [forty_principles, oz_ov, ikr, ariz]
  differs_from:
    ikr: "Противоречия — формулировка ПРОБЛЕМЫ, ИКР — формулировка ИДЕАЛА"
    forty_principles: "Противоречия — поставка задачи, 40 Принципов — способ решения"
  input: "Конфликтующие параметры + контекст"
  output: "ТП (пара параметров) + ФП (элемент + состояния А/не-А)"
  dependencies: [functional_analysis, akts]
  constraints:
    - "ФП: элемент должен быть ОДИН объект, состояния — ПОЛНЫЕ противоположности"
    - "ФП должно быть привязано к конкретным ОЗ/ОВ"

oz_ov:
  name_ru: "Оперативная зона и оперативное время"
  phase: [analysis]  # NLM fix: по Редколис это АНАЛИЗ, не Моделирование
  redkolis_code: "ОЗ-ОВ"
  category: core_triz
  trigger:
    - "Нужно локализовать проблему в пространстве и времени"
    - "Подготовка к ресурсному анализу"
    - "Задача слишком размытая — нужна конкретика"
  goal: "Определить ГДЕ и КОГДА происходит ключевое взаимодействие"
  when_not_to_use:
    - "Применение ДО выявления ключевого недостатка через ПСА/ФА"
    - "Применение ПОСЛЕ ресурсного анализа (РА идёт после ОЗ-ОВ!)"
  sequence_after: [causal_analysis, functional_analysis, contradictions]
  leads_to: [resource_analysis, ikr]  # РА — строго ПОСЛЕ ОЗ-ОВ!
    resource_analysis: "ОЗ-ОВ определяет ЗОНУ, РА ищет ресурсы ВНУТРИ этой зоны"
    rvs: "ОЗ-ОВ — конкретная локализация, РВС — мысленный эксперимент с масштабами"
  input: "Описание проблемной ситуации"
  output: "Определение ОЗ (пространство) + ОВ (время) + конфликтующая пара"
  dependencies: [ariz, resource_analysis]
  constraints:
    - "Ресурсный анализ ТОЛЬКО после определения ОЗ-ОВ!"

ikr:
  name_ru: "Идеальный конечный результат"
  phase: [modeling]
  redkolis_code: "ИКР"
  category: core_triz
  trigger:
    - "Нужно определить идеальное решение"
    - "'Как должно быть в идеале?'"
    - "Формулировка ИКР для АРИЗ"
  goal: "Сформулировать ИКР: X-элемент САМ выполняет функцию"
  when_not_to_use:
    - "Применение без предшествующего выявления ресурсов"
    - "Формулировка до локализации ОЗ и ОВ"
  sequence_after: [oz_ov, contradictions, resource_analysis]
  leads_to: [effects, standards, ariz]
  differs_from:
    contradictions: "ИКР — формулировка ИДЕАЛА, Противоречия — формулировка ПРОБЛЕМЫ"
    dnd: "ИКР — канонический идеал, ДНД — допущение невозможного"
  input: "ФП + ОЗ-ОВ + ресурсы"
  output: "Формулировка ИКР + X-элемент"
  dependencies: [ariz, trimming]
  constraints:
    - "X-элемент должен быть из списка ресурсов"
    - "Формулировка обязательно содержит 'САМ/САМА/САМО'"
    - "Не добавлять новые устройства/вещества"

vepoli:
  name_ru: "Вепольный анализ (Су-Филд)"
  phase: [modeling]
  redkolis_code: "ВЕПОЛИ"
  category: core_triz
  trigger:
    - "Нужно моделировать систему как поле+вещества"
    - "Есть вредное взаимодействие между компонентами"
    - "Нужно усилить/ослабить/изменить взаимодействие"
  goal: "Построить вепольную модель → определить тип задачи → подобрать стандарт"
  when_not_to_use:
    - "Разрешение параметрических, не структурных конфликтов (для этого нужен ТП)"
    - "Без предварительного ФА — нет данных о взаимодействиях"
  sequence_after: [functional_analysis]
  leads_to: [standards]  # Стандарты ТОЛЬКО после вепольной модели!
  differs_from:
    functional_analysis: "ФА — полная модель всех функций, Вепольный — упрощённая модель поле+вещества"
    standards: "Веполи — модель, Стандарты — способы преобразования веполей"
  input: "Проблемное взаимодействие"
  output: "Вепольная модель + тип задачи (неполный веполь, вредный веполь...)"
  dependencies: [standards]
  constraints: []

ariz:
  name_ru: "АРИЗ (Алгоритм решения изобретательских задач)"
  phase: [modeling, synthesis]
  redkolis_code: "АРИЗ"
  category: core_triz
  trigger:
    - "Тупик — другие инструменты не помогли"
    - "Сложная задача с глубоким противоречием"
    - "Нужен пошаговый алгоритм решения"
  goal: "Провести через 9 частей АРИЗ-85В → получить решение"
  when_not_to_use:
    - "Простые задачи, решаемые одним инструментом (40 Принципов, ФОП)"
    - "Задача не содержит глубокого противоречия"
  sequence_after: [contradictions, oz_ov, resource_analysis]
  leads_to: [effects, standards, ikr]
  differs_from:
    arip: "АРИЗ — полный алгоритм (9 частей), АРИП — облегчённая версия"
    contradictions: "Противоречия — один шаг, АРИЗ — полный алгоритм включающий их"
  input: "Мини-задача + ТП/ФП (или будут сформулированы в процессе)"
  output: "Решение + проверка + применение"
  dependencies: [contradictions, ikr, resource_analysis, standards, effects]
  constraints:
    - "Используется когда другие методы не помогли"
    - "Присутствует и в Моделировании, и в Синтезе по Редколис"

trimming:
  name_ru: "Тримминг (Свёртывание)"
  phase: [modeling]
  redkolis_code: "ФСА (часть)"
  category: core_triz
  trigger:
    - "Система избыточна — слишком много компонентов"
    - "Нужно упростить/удешевить систему"
    - "Ищем что удалить без потери функций"
  goal: "Удалить компоненты, перераспределив их функции на оставшиеся"
  when_not_to_use:
    - "КРИТИЧНО: Применение ДО завершения ФА/ФСА"
    - "Удаление элемента без передачи его полезной функции оставшимся ресурсам"
  sequence_after: [functional_analysis, value_analysis]  # СТРОГО после ФА/ФСА!
  leads_to: [contradictions, resource_analysis, oas_transfer]
  differs_from:
    value_analysis: "ФСА оценивает стоимость, Тримминг — удаляет компоненты"
    functional_analysis: "ФА строит модель, Тримминг использует её для свёртывания"
  input: "Функциональная модель"
  output: "Список кандидатов на удаление + варианты перераспределения функций"
  dependencies: [functional_analysis]
  constraints: []

rvs:
  name_ru: "Оператор РВС (Размер—Время—Стоимость)"
  phase: [modeling]
  redkolis_code: "РВС"
  category: core_triz
  trigger:
    - "Тупик — нужно сломать психологическую инерцию"
    - "Мысленные эксперименты с масштабами"
    - "Подготовка к РТВ"
  goal: "Мысленные эксперименты: что если размер → 0/∞, время → 0/∞, стоимость → 0/∞"
  when_not_to_use:
    - "Этап строгой инженерной верификации"
    - "Параметры, жёстко зафиксированные стандартами безопасности"
  sequence_after: [contradictions, oz_ov]
  leads_to: [ikr, mmch, rtv]
  differs_from:
    oz_ov: "РВС — мысленный эксперимент, ОЗ-ОВ — реальная локализация"
    mmch: "РВС меняет масштабы, ММЧ визуализирует поведение 'маленьких человечков'"
  input: "Задача + параметры для варьирования"
  output: "Инсайты от мысленных экспериментов"
  dependencies: [ikr, system_operator]
  constraints: []

mmch:
  name_ru: "Метод маленьких человечков"
  phase: [modeling]
  redkolis_code: "ФИМ"
  category: core_triz
  trigger:
    - "Нужно визуализировать поведение вещества в ОЗ"
    - "Сложно понять что происходит на микроуровне"
    - "Подготовка к использованию эффектов"
  goal: "Визуализация через 'маленьких человечков' → понять требования к веществу/полю"
  when_not_to_use:
    - "Макроуровневые задачи без микроконфликтов"
    - "Если ОЗ не определена — визуализация не имеет фокуса"
  sequence_after: [oz_ov, contradictions]
  leads_to: [effects, vepoli]
  differs_from:
    rvs: "ММЧ визуализирует поведение, РВС — меняет масштабы"
    vepoli: "ММЧ — интуитивная визуализация, Веполи — формальная модель"
  input: "ОЗ + конфликтующее взаимодействие"
  output: "Визуальная модель + требования к идеальному поведению"
  dependencies: [ariz, effects]
  constraints: []

morphological_analysis:
  name_ru: "Морфологический анализ"
  phase: [modeling]
  redkolis_code: "ФИМП"
  category: core_triz
  trigger:
    - "Нужно систематически перебрать комбинации решений"
    - "Много альтернатив для каждого параметра"
    - "Синтез новой системы из компонентов"
  goal: "Построить морфологическую таблицу → сгенерировать комбинации"
  when_not_to_use:
    - "Задача с одним ясным противоречием (излишне: достаточно 40 Принципов)"
    - "Без определённых альтернатив для каждого параметра"
  sequence_after: [functional_analysis, contradictions]
  leads_to: [fos, effects]
  differs_from:
    fos: "Морф. анализ перебирает КОМБИНАЦИИ, ФОП ищет АНАЛОГИ функций"
    functional_analysis: "ФА анализирует существующее, МА генерирует новое"
  input: "Параметры системы + их альтернативы"
  output: "Морфологическая таблица + перспективные комбинации"
  dependencies: [functional_analysis, ikr]
  constraints: []

inversion:
  name_ru: "Инверсия (Обращение)"
  phase: [modeling]
  redkolis_code: "ИА"
  category: extended  # Codex fix: ИА не в каноне Редколис
  # NB: ИА расширенный инструмент, не входит в каноническую таблицу 34 инструментов
  trigger:
    - "Нужно посмотреть на задачу 'наоборот'"
    - "Инверсия противоречия"
    - "Обращение действия/структуры"
  goal: "Применить приём инверсии — обратить задачу/функцию/структуру"
  differs_from:
    dnd: "Инверсия обращает РЕАЛЬНОЕ, ДНД допускает НЕВОЗМОЖНОЕ"
    antisystem: "Инверсия — один приём, Антисистема — построение полной анти-модели"
  input: "Задача/функция для инверсии"
  output: "Инвертированная постановка + новые идеи"
  dependencies: [contradictions]
  constraints: []

dnd:
  name_ru: "Допустить недопустимое"
  phase: [modeling]
  redkolis_code: ""
  category: extended
  trigger:
    - "Тупик — все 'нормальные' подходы исчерпаны"
    - "Нужно сломать ментальные барьеры"
    - "Фантазийный подход к задаче"
  goal: "Допустить невозможное → получить направление решения"
  differs_from:
    ikr: "ИКР — канонический идеал, ДНД — фантазийное допущение"
    goldfish: "ДНД — один приём, Золотая рыбка — структурированная процедура"
  input: "Тупиковая задача"
  output: "Нестандартные направления решения"
  dependencies: [contradictions]
  constraints: []

antisystem:
  name_ru: "Антисистема"
  phase: [modeling]
  redkolis_code: ""
  category: extended
  trigger:
    - "Нужно построить систему-антипод"
    - "Анализ через инвертирование всех функций"
    - "Поиск идей через отрицание"
  goal: "Построить анти-модель системы (все функции инвертированы)"
  differs_from:
    inversion: "Инверсия — один приём, Антисистема — полная анти-модель"
    diversion_analysis: "ДА ищет уязвимости, Антисистема строит полный антипод"
  input: "Функциональная модель системы"
  output: "Анти-модель + инсайты от сравнения"
  dependencies: [diversion_analysis, zrts]
  constraints: []

resource_analysis:
  name_ru: "Ресурсный анализ (ВПР)"
  phase: [analysis]  # Codex fix: РА только в Анализе по канону
  redkolis_code: "РА"
  category: core_triz
  trigger:
    - "Нужно найти ресурсы для реализации ИКР"
    - "Ищем бесплатные/дешёвые способы решения"
    - "Сформулированы ОЗ и ОВ"
  goal: "Выявить все доступные ресурсы (вещественные, полевые, информационные, временные)"
  when_not_to_use:
    - "КРИТИЧНО: Применение ДО локализации ОЗ-ОВ (бесконечный перебор!)"
    - "Применение в формате случайного мозгового штурма (нужна структура)"
  sequence_after: [oz_ov]  # СТРОГО после ОЗ-ОВ!
  leads_to: [ikr, ariz, effects, arip]
    oz_ov: "ОЗ-ОВ определяет ЗОНУ, РА ищет ресурсы ВНУТРИ зоны"
    functional_analysis: "ФА описывает функции, РА — доступные ресурсы"
  input: "ОЗ-ОВ + описание системы и надсистемы"
  output: "Классифицированный список ресурсов (≥10 шт)"
  dependencies: [trimming]
  constraints:
    - "КРИТИЧНО: РА — ТОЛЬКО после определения ОЗ-ОВ!"
    - "Ресурсы ищутся в системе, надсистеме и среде"

